options {
    directory "/var/cache/bind";
    listen-on { any; };
    allow-query { any; };
    forwarders {
        8.8.8.8;
        8.8.4.4;
    };
    dnssec-validation no;
};

logging {
    channel query_log {
        file "/var/cache/bind/query.log" versions 3 size 5m;
        severity info;
        print-time yes;
        print-category yes;
    };
    category queries { query_log; };
};

zone "." {
    type hint;
    file "/usr/share/dns/root.hints";
};